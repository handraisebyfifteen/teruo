<svg xmlns="http://www.w3.org/2000/svg" width="880" height="760" viewBox="0 0 880 760" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Meiryo',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="760" fill="#ffffff"/>

  <!-- タイトル -->
  <text x="40" y="44" font-size="22" font-weight="700" fill="#0f172a">teruo — アーキテクチャ</text>
  <text x="40" y="68" font-size="13" fill="#64748b">計算は Python、判断は AI。数値をモデルに暗算させない。</text>

  <!-- 利用者 -->
  <rect x="250" y="96" width="380" height="78" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="440" y="126" font-size="16" font-weight="700" fill="#7c2d12" text-anchor="middle">店主 ／ 在庫担当スタッフ</text>
  <text x="440" y="150" font-size="12.5" fill="#9a3412" text-anchor="middle">CLI で日本語のまま話すだけ（メモ貼り付けも可）</text>

  <!-- 矢印: 対話 -->
  <line x1="430" y1="174" x2="430" y2="228" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="228" x2="450" y2="174" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="468" y="206" font-size="12.5" fill="#475569">対話</text>

  <!-- エージェント -->
  <rect x="180" y="230" width="520" height="112" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="196" y="246" width="52" height="24" rx="12" fill="#3b82f6"/>
  <text x="222" y="263" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">判断</text>
  <text x="262" y="264" font-size="16" font-weight="700" fill="#1e3a8a">Strands Agent</text>
  <text x="262" y="286" font-size="12.5" fill="#1e40af">Amazon Bedrock ／ Claude Sonnet（us-east-2）</text>
  <text x="196" y="316" font-size="12.5" fill="#334155">・どの品目を今日数えてもらうか選ぶ　・異常値の指摘</text>
  <text x="196" y="334" font-size="12.5" fill="#334155">・報告のタイミング（営業中は黙る、開店前に伝える）</text>

  <!-- 矢印: tool 呼び出し -->
  <line x1="440" y1="342" x2="440" y2="396" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="458" y="374" font-size="12.5" fill="#475569">tool 呼び出し（数値は渡すだけ・暗算しない）</text>

  <!-- Python ツール群 -->
  <rect x="80" y="398" width="720" height="210" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <rect x="96" y="414" width="52" height="24" rx="12" fill="#10b981"/>
  <text x="122" y="431" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">計算</text>
  <text x="162" y="432" font-size="16" font-weight="700" fill="#065f46">Python ツール群 — 計算はすべてここ</text>

  <!-- 日々の入力 -->
  <rect x="104" y="452" width="328" height="136" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="120" y="478" font-size="13.5" font-weight="700" fill="#065f46">日々の入力（誰でも）</text>
  <text x="120" y="504" font-size="12.5" fill="#334155">record_sales　売上 → レシピ経由で在庫減算</text>
  <text x="120" y="524" font-size="12.5" fill="#334155">record_count　棚卸し → 消費係数を学習</text>
  <text x="120" y="544" font-size="12.5" fill="#334155">record_purchase　仕入れ（メモ貼り付け）</text>
  <text x="120" y="564" font-size="12.5" fill="#334155">get_stock_status　在庫一覧</text>

  <!-- 構造変更 -->
  <rect x="448" y="452" width="336" height="136" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="464" y="478" font-size="13.5" font-weight="700" fill="#991b1b">構造変更（店主のみ・合言葉＋変更通知）</text>
  <text x="464" y="504" font-size="12.5" fill="#334155">register_item ／ register_product　登録</text>
  <text x="464" y="524" font-size="12.5" fill="#334155">update_recipe ／ update_item　レシピ・単位</text>
  <text x="464" y="544" font-size="12.5" fill="#334155">delete_product　商品削除（品目は消せない）</text>
  <text x="464" y="564" font-size="12.5" fill="#991b1b">変更前後の値を履歴に残す</text>

  <!-- 矢印: 読み書き -->
  <line x1="440" y1="608" x2="440" y2="662" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="458" y="640" font-size="12.5" fill="#475569">読み書き（アトミック書き込み・同時書き込み検知）</text>

  <!-- データ -->
  <rect x="220" y="664" width="440" height="70" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="440" y="692" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">data/state.json</text>
  <text x="440" y="714" font-size="12.5" fill="#475569" text-anchor="middle">在庫・レシピ・売上履歴（event/solo別）・設定変更履歴</text>
</svg>
