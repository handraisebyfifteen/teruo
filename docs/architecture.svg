<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1064" viewBox="0 0 880 1064" font-family="'Helvetica Neue',Arial,'Noto Sans',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="1064" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="44" font-size="22" font-weight="700" fill="#0f172a">teruo — architecture</text>
  <text x="40" y="68" font-size="13" fill="#64748b">Python calculates, AI judges. The model never does mental math.</text>

  <!-- Users -->
  <rect x="250" y="96" width="380" height="78" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="440" y="126" font-size="16" font-weight="700" fill="#7c2d12" text-anchor="middle">Owner / inventory staff</text>
  <text x="440" y="150" font-size="12.5" fill="#9a3412" text-anchor="middle">Just talk in the CLI (pasting notes works too)</text>

  <!-- Arrows: conversation -->
  <line x1="430" y1="174" x2="430" y2="228" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="228" x2="450" y2="174" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="468" y="206" font-size="12.5" fill="#475569">conversation</text>

  <!-- Judgment layer: 3 agents -->
  <rect x="120" y="230" width="640" height="222" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="136" y="246" width="70" height="24" rx="12" fill="#3b82f6"/>
  <text x="171" y="263" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">judges</text>
  <text x="220" y="264" font-size="16" font-weight="700" fill="#1e3a8a">Strands Agents — split into 3 roles</text>
  <text x="220" y="284" font-size="12.5" fill="#1e40af">Amazon Bedrock / Claude (us-east-2) · agents as tools</text>

  <rect x="140" y="296" width="600" height="60" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="156" y="320" font-size="13.5" font-weight="700" fill="#1e3a8a">Reporter (front desk)</text>
  <text x="156" y="342" font-size="12.5" fill="#334155">Decides when to say what. Quiet during service. Structure changes (passphrase) go owner-direct</text>

  <line x1="300" y1="356" x2="300" y2="378" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="356" x2="580" y2="378" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="140" y="380" width="290" height="56" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="156" y="402" font-size="13.5" font-weight="700" fill="#1e3a8a">Record keeper</text>
  <text x="156" y="424" font-size="12.5" fill="#334155">Records sales, counts, purchases. No judgment</text>

  <rect x="450" y="380" width="290" height="56" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="466" y="402" font-size="13.5" font-weight="700" fill="#1e3a8a">Observer</text>
  <text x="466" y="424" font-size="12.5" fill="#334155">Spots anomalies, picks today's 2-3 items to count</text>

  <!-- Arrow: tool calls -->
  <line x1="440" y1="452" x2="440" y2="500" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="458" y="482" font-size="12.5" fill="#475569">tool calls (numbers passed through — no mental math)</text>

  <!-- Python tools -->
  <rect x="80" y="502" width="720" height="378" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <rect x="96" y="518" width="90" height="24" rx="12" fill="#10b981"/>
  <text x="141" y="535" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">calculates</text>
  <text x="200" y="536" font-size="16" font-weight="700" fill="#065f46">Python tools — all arithmetic lives here</text>

  <!-- Daily entries and queries -->
  <rect x="104" y="556" width="328" height="196" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="120" y="582" font-size="13.5" font-weight="700" fill="#065f46">Daily entries &amp; queries (anyone, no passphrase)</text>
  <text x="120" y="608" font-size="12.5" fill="#334155">record_sales — sales → stock down per consumption type</text>
  <text x="120" y="628" font-size="12.5" fill="#334155">record_count — stock count → learns weight coefficients</text>
  <text x="120" y="648" font-size="12.5" fill="#334155">record_unit_used — empty unit → settles unit items</text>
  <text x="120" y="668" font-size="12.5" fill="#334155">record_purchase — purchases (paste your notes)</text>
  <text x="120" y="688" font-size="12.5" fill="#334155">get_stock_status / get_capacity — stock &amp; servings left</text>
  <text x="120" y="708" font-size="12.5" fill="#334155">get_sales_summary — averages by venue type</text>
  <text x="120" y="728" font-size="12.5" fill="#334155">get_monthly_reconciliation — monthly cross-check</text>

  <!-- Structure changes -->
  <rect x="448" y="556" width="336" height="196" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="464" y="582" font-size="13.5" font-weight="700" fill="#991b1b">Structure changes (owner only · passphrase + notify)</text>
  <text x="464" y="608" font-size="12.5" fill="#334155">register_item / register_product — registration</text>
  <text x="464" y="628" font-size="12.5" fill="#334155">update_recipe / update_item — recipes &amp; units</text>
  <text x="464" y="648" font-size="12.5" fill="#334155">delete_product — delete a product (items never die)</text>
  <text x="464" y="668" font-size="12.5" fill="#334155">update_config — passphrase &amp; notification email</text>
  <text x="464" y="700" font-size="12.5" fill="#991b1b">Before/after values always logged</text>
  <text x="464" y="720" font-size="12.5" fill="#991b1b">The coefficient cap closes the loophole where</text>
  <text x="464" y="738" font-size="12.5" fill="#991b1b">daily entries quietly rewrite the recipe</text>

  <!-- The three consumption types -->
  <rect x="104" y="768" width="680" height="96" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="120" y="792" font-size="13.5" font-weight="700" fill="#065f46">consumption_type splits the coefficient logic three ways</text>
  <text x="120" y="816" font-size="12.5" fill="#334155">count — no coefficient, fixed 1.0 (pita, paper goods) — never moves, so it anchors the others</text>
  <text x="120" y="836" font-size="12.5" fill="#334155">weight — learns grams/serving from count diffs (moves halfway to measured). Cap: recipe ±4g/serving</text>
  <text x="120" y="856" font-size="12.5" fill="#334155">unit — empty units settle "servings per bottle". Cap: past records ±20% (sauce, oil)</text>

  <!-- Arrow: reads/writes -->
  <line x1="440" y1="880" x2="440" y2="934" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="458" y="912" font-size="12.5" fill="#475569">reads/writes (atomic writes · concurrent-write detection)</text>

  <!-- Data -->
  <rect x="180" y="936" width="520" height="92" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="440" y="964" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">data/state.json</text>
  <text x="440" y="986" font-size="12.5" fill="#475569" text-anchor="middle">stock · recipes · sales history (event/solo) · empty-unit records · settings log</text>
  <text x="440" y="1008" font-size="12.5" fill="#475569" text-anchor="middle">Records only "when". Never "who entered it".</text>
</svg>
