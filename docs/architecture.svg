<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1086" viewBox="0 0 880 1086" font-family="'Helvetica Neue',Arial,'Noto Sans',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="1086" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="44" font-size="22" font-weight="700" fill="#0f172a">teruo — architecture</text>
  <text x="40" y="68" font-size="13" fill="#64748b">Python calculates, the AI decides. No arithmetic is ever delegated to the model.</text>

  <!-- Users -->
  <rect x="250" y="96" width="380" height="78" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="440" y="126" font-size="16" font-weight="700" fill="#7c2d12" text-anchor="middle">Owner / inventory staff</text>
  <text x="440" y="150" font-size="12.5" fill="#9a3412" text-anchor="middle">They just talk. Pasted delivery notes work too.</text>

  <!-- Arrows: conversation -->
  <line x1="430" y1="174" x2="430" y2="228" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="228" x2="450" y2="174" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="468" y="206" font-size="12.5" fill="#475569">conversation (CLI)</text>

  <!-- Judgment layer: 3 agents -->
  <rect x="120" y="230" width="640" height="240" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="136" y="246" width="70" height="24" rx="12" fill="#3b82f6"/>
  <text x="171" y="263" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">decides</text>
  <text x="220" y="264" font-size="16" font-weight="700" fill="#1e3a8a">Strands Agents — three roles</text>
  <text x="220" y="284" font-size="12.5" fill="#1e40af">Amazon Bedrock · Claude (us-east-2) · agents-as-tools</text>

  <rect x="140" y="296" width="600" height="64" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="156" y="320" font-size="13.5" font-weight="700" fill="#1e3a8a">Reporter — the front desk</text>
  <text x="156" y="342" font-size="12.5" fill="#334155">Decides when to speak — silent during the rush. Owner-only changes need the passphrase.</text>

  <line x1="300" y1="360" x2="300" y2="382" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="360" x2="580" y2="382" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="140" y="384" width="290" height="72" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="156" y="408" font-size="13.5" font-weight="700" fill="#1e3a8a">Record keeper</text>
  <text x="156" y="428" font-size="12.5" fill="#334155">Takes sales, stock counts, deliveries.</text>
  <text x="156" y="446" font-size="12.5" fill="#334155">Records the numbers. Never judges them.</text>

  <rect x="450" y="384" width="290" height="72" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="466" y="408" font-size="13.5" font-weight="700" fill="#1e3a8a">Observer</text>
  <text x="466" y="428" font-size="12.5" fill="#334155">Spots anomalies. Picks the 2–3 items</text>
  <text x="466" y="446" font-size="12.5" fill="#334155">worth counting tonight.</text>

  <!-- Arrow: tool calls -->
  <line x1="440" y1="470" x2="440" y2="518" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="458" y="490" font-size="12.5" fill="#475569">tool calls — numbers are handed over,</text>
  <text x="458" y="508" font-size="12.5" fill="#475569">never computed by the model</text>

  <!-- Python tools -->
  <rect x="80" y="520" width="720" height="386" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <rect x="96" y="536" width="90" height="24" rx="12" fill="#10b981"/>
  <text x="141" y="553" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">calculates</text>
  <text x="200" y="554" font-size="16" font-weight="700" fill="#065f46">Python tools — all the math lives here</text>

  <!-- Daily entries and queries -->
  <rect x="104" y="574" width="328" height="200" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="120" y="600" font-size="13.5" font-weight="700" fill="#065f46">Daily use — anyone, no passphrase</text>
  <text x="120" y="626" font-size="12.5" fill="#334155">record_sales — sales in, stock down</text>
  <text x="120" y="646" font-size="12.5" fill="#334155">record_count — physical count → coefficient</text>
  <text x="120" y="666" font-size="12.5" fill="#334155">record_unit_used — "the bottle ran empty"</text>
  <text x="120" y="686" font-size="12.5" fill="#334155">record_purchase — free-text delivery notes</text>
  <text x="120" y="706" font-size="12.5" fill="#334155">get_stock_status / get_capacity — what's left</text>
  <text x="120" y="726" font-size="12.5" fill="#334155">get_sales_summary — event vs. solo averages</text>
  <text x="120" y="746" font-size="12.5" fill="#334155">get_monthly_reconciliation — month-end check</text>

  <!-- Structure changes -->
  <rect x="448" y="574" width="336" height="200" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="464" y="600" font-size="13.5" font-weight="700" fill="#991b1b">Structure changes — owner only</text>
  <text x="464" y="626" font-size="12.5" fill="#334155">register_item / register_product</text>
  <text x="464" y="646" font-size="12.5" fill="#334155">update_recipe / update_item — recipes, units</text>
  <text x="464" y="666" font-size="12.5" fill="#334155">delete_product — products go, items never do</text>
  <text x="464" y="686" font-size="12.5" fill="#334155">update_config — passphrase, notify email</text>
  <text x="464" y="714" font-size="12.5" fill="#991b1b">Every change logs its before &amp; after values.</text>
  <text x="464" y="734" font-size="12.5" fill="#991b1b">The coefficient cap closes the back door</text>
  <text x="464" y="752" font-size="12.5" fill="#991b1b">where daily entries quietly rewrite the recipe.</text>

  <!-- The three consumption types -->
  <rect x="104" y="790" width="680" height="100" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="120" y="814" font-size="13.5" font-weight="700" fill="#065f46">One coefficient, three consumption types</text>
  <text x="120" y="838" font-size="12.5" fill="#334155">count — fixed at 1.0 (pita, paper goods). It never moves, so it anchors what the others learn.</text>
  <text x="120" y="858" font-size="12.5" fill="#334155">weight — learned from count diffs, easing halfway to each measurement. Cap: recipe ±4g per serving.</text>
  <text x="120" y="878" font-size="12.5" fill="#334155">unit — settled the moment a bottle runs empty ("1 bottle ≈ 50 servings"). Cap: past records ±20%.</text>

  <!-- Arrow: reads/writes -->
  <line x1="440" y1="906" x2="440" y2="958" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="458" y="936" font-size="12.5" fill="#475569">reads &amp; writes — atomic, with concurrent-write detection</text>

  <!-- Data -->
  <rect x="180" y="960" width="520" height="92" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="440" y="988" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">data/state.json</text>
  <text x="440" y="1010" font-size="12.5" fill="#475569" text-anchor="middle">stock · recipes · sales history (event / solo) · unit records · settings log</text>
  <text x="440" y="1032" font-size="12.5" fill="#475569" text-anchor="middle">It records when. It never records who.</text>
</svg>
